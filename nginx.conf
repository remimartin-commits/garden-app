events { worker_connections 1024; }

http {
    upstream app { server app:8000; }

    server {
        listen 80;
        server_name dvletsgarden.com www.dvletsgarden.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dvletsgarden.com www.dvletsgarden.com;

        ssl_certificate /etc/letsencrypt/live/dvletsgarden.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dvletsgarden.com/privkey.pem;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /app/app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
